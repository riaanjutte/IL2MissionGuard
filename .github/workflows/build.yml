name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild IL2MissionGuard.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Test
        run: .\tests\IL2MissionGuard.Tests\bin\IL2MissionGuard.Tests.exe

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: IL2MissionGuard-win-x64
          path: src/IL2MissionGuard/bin/x64/Release/IL2MissionGuard.exe
          if-no-files-found: error

